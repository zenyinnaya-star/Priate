[project]
name = "alberta-grid-pipeline"
version = "0.1.0"
description = "Observable AESO electricity market data pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dbt-core>=1.8,<2.0",
  "dbt-duckdb>=1.8,<2.0",
  "duckdb>=1.0,<2.0",
  "prefect>=3.0,<4.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0",
  "tenacity>=8.2,<10.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120

target-version = "py311"
